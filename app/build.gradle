plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sandstrike.game'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.sandstrike.game'
        minSdk 21
        targetSdk 34
        versionCode 17
        versionName '4.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        grit {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug { if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.grit }
        release { minifyEnabled false; if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.grit }
    }
}
